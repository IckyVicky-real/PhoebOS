  function CloudsAndShit(){
  fetch(baseurl)
    .then(res => res.json())
    .then(data => {
      const weatherHtml = data.temp_celsius + '°C • ' + data.description +
        '<br>Wind: ' + data.wind_speed_kmh + ' km/h • Humidity: ' + data.humidity_percent + '%';
      document.getElementById('WeatherHere').innerHTML =
        '<strong>' + data.location + '</strong><br>' + weatherHtml;
        return data.temp_celsius + '°C • ' + data.description +
        '<br>Wind: ' + data.wind_speed_kmh + ' km/h • Humidity: ' + data.humidity_percent + '%';
    })
    .catch(function() {
      document.getElementById('WeatherHere').innerHTML =
        '<p>Weather not available right now</p>';
        return weatherHtml + 'here is your weather'
    });
    cButton.addEventListener('click', GetWeather, false);
}
