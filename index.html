<!DOCTYPE html>
<html>

        </p>

        </audio>
    </div>

        <p id="GalleryText" style="margin: 0px; color: #fff; ">Gallery</p>

</div>

  </div>
</div>

<div class="responsive">

</div>

<p style="cursor: pointer" id="WeatherClose">x</p>

        <div id="desktopApps" style="padding-top: 40px; padding-left: 16px;">
      <div style="text-align: center; padding: 16px; filter: drop-shadow(0 0 8px black); width: fit-content">

        <p id="NotesText" style="margin: 0px; color: #fff; ">Notes</p>
      </div>

        <div id="NotesApp" style="display: none; position: absolute; top: 50%; left: 50%;>

<div class="NotesStuff">
  <p style="cursor: pointer" id="NotesClose">x</p>
  <h1>Notes App</h1>
  <form id="NoteForm">
    <textarea id="NoteInput" placeholder="Write your note..." required></textarea>
    <button type="Submit">Add Note</button>
  </form>
  <div id="NotesList"></div>
</div>
